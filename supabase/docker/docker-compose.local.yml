# Starbreakers.net : services réservés au développement local (jamais déployés).
# À activer après docker-compose.starbreakers.yml : `sh run.sh config add starbreakers local`.
# Les ports publiés ici sont tous liés à 127.0.0.1 : rien n'est joignable depuis le réseau local.

services:
  # Postgres accessible depuis la machine (IntelliJ, psql, CLI Supabase)
  db:
    ports:
      - "127.0.0.1:5432:5432"

  # Capteur de mails : avec SMTP_HOST=mailpit / SMTP_PORT=1025 dans .env, GoTrue y envoie tous ses
  # mails, lisibles sur https://mail.starbreakers.localhost. Rien ne sort de la machine.
  mailpit:
    image: axllent/mailpit:v1.33.0
    restart: unless-stopped

  # Reverse proxy local : domaines *.starbreakers.localhost en HTTPS (CA interne de Caddy).
  # Le front (Vite) tourne sur l'hôte, voir ../../caddy/Caddyfile.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      api-gw:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - ../../caddy/Caddyfile:/etc/caddy/Caddyfile:ro,z
      - caddy-data:/data
      - caddy-config:/config
      - ../../caddy/local-ca:/export:z
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        (
          until [ -f /data/caddy/pki/authorities/local/root.crt ]; do sleep 1; done
          cp /data/caddy/pki/authorities/local/root.crt /export/root.crt
          echo "Certificat exporté vers caddy/local-ca/root.crt"
        ) &
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile

volumes:
  caddy-data:
  caddy-config:
