name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint, types et build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: corepack enable

      - run: yarn install --immutable

      - name: Format (Prettier)
        run: yarn prettier --check src/

      # Sans --fix, contrairement à yarn lint : la CI vérifie, elle ne corrige pas
      - name: Lint (oxlint)
        run: yarn oxlint . -D correctness --ignore-path .gitignore --ignore-pattern "supabase/docker/**"

      - name: Lint (ESLint)
        run: yarn eslint .

      - name: Types
        run: yarn type-check

      - name: Build
        run: yarn build-only
