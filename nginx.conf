# Front en staging/prod (Dockerfile.prod). Modèle traité au démarrage par l'image officielle nginx
# (envsubst, /etc/nginx/templates) : ${ROBOTS_TAG} est remplacé par la variable d'environnement.
# Les variables nginx ($uri…) ne sont pas touchées, puisqu'elles ne sont pas définies dans l'environnement.

server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Compression des fichiers texte (le bundle JS fait plusieurs Mo non compressé)
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Fichiers générés par Vite, nommés d'après leur contenu : cache d'un an. Un fichier absent répond
    # 404 (et non index.html), pour qu'un ancien onglet ne charge pas du HTML à la place d'un script.
    location /assets/ {
        # Beta : « noindex, nofollow » ; prod : vide, et nginx n'envoie pas d'en-tête vide.
        # Répété dans chaque location : un add_header de location annule ceux du niveau server.
        add_header X-Robots-Tag "${ROBOTS_TAG}" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Applications auto-hébergées (public/apps, ex. Bonjourr) : revalidées à chaque visite comme le
    # reste de public/, mais un fichier absent répond 404 au lieu de l'index.html du site.
    location /apps/ {
        add_header X-Robots-Tag "${ROBOTS_TAG}" always;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # index.html et fichiers de public/ : revalidés à chaque visite (ETag), pour qu'un déploiement
    # soit pris en compte immédiatement. Toute autre adresse renvoie index.html (routes du front).
    location / {
        add_header X-Robots-Tag "${ROBOTS_TAG}" always;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
