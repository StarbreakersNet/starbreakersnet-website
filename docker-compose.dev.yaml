###
### Surcharges réservées au développement local (jamais déployées).
### Les ports publiés ici sont tous liés à 127.0.0.1 : rien n'est joignable depuis le réseau local.
###
services:
  db:
    ports:
      - "127.0.0.1:5432:5432"

  # GoTrue envoie ses mails (confirmation, mot de passe oublié, changement d'email) à Mailpit
  auth:
    environment:
      GOTRUE_SMTP_HOST: mailpit
      GOTRUE_SMTP_PORT: 1025
      GOTRUE_SMTP_USER: ""
      GOTRUE_SMTP_PASS: ""
      GOTRUE_SMTP_ADMIN_EMAIL: noreply@starbreakers.localhost

  # Capteur de mails : rien ne sort de la machine, les mails sont lisibles sur
  # https://mail.starbreakers.localhost (via Caddy)
  mailpit:
    profiles:
      - dev
    image: axllent/mailpit:v1.33.0
    restart: unless-stopped

  # Reverse proxy local : domaines *.starbreakers.localhost en HTTPS (CA interne de Caddy).
  # Même famille d'outil qu'en staging/prod (Ingressi est basé sur Caddy).
  caddy:
    profiles:
      - dev
    image: caddy:2-alpine
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ./caddy/local-ca:/export
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        (
          until [ -f /data/caddy/pki/authorities/local/root.crt ]; do sleep 1; done
          cp /data/caddy/pki/authorities/local/root.crt /export/root.crt
          echo "Certificat exporté vers ./caddy/local-ca/root.crt"
        ) &
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile

volumes:
  caddy_data:
  caddy_config:
